<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emergency AI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="hero">

        <!-- Moving Ambulance -->
        <div class="ambulance-container">

            <div class="ambulance">

                <div class="emergency-light"></div>

                🚑

            </div>

        </div>


        <!-- Main Content -->
        <div class="content">

            <h1>
                Emergency <span>AI</span>
            </h1>

            <p class="tagline">
                Every second matters.
            </p>

            <p class="description">
                An AI-powered emergency response system that
                understands, responds and connects help faster.
            </p>

            <button id="startButton">
                <span>🚨</span>
                Start Emergency Demo
            </button>

            <p class="status">
                ● AI Emergency System Ready
            </p>

        </div>


        <!-- Background Pulse -->
        <div class="pulse-circle circle-1"></div>
        <div class="pulse-circle circle-2"></div>
        <div class="pulse-circle circle-3"></div>

    </main>


    <script src="js/main.js"></script>

</body>

</html>
